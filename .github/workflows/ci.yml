name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, sim lint, unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm run lint:sim
      - run: npm test

  browser:
    name: browser tests (headless Chromium, WebGPU via SwiftShader)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            playwright-report
            test-results
          retention-days: 7

  electron:
    name: Electron smoke (xvfb, SwiftShader)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npx playwright install-deps chromium
      - name: Electron on the repo root (development, no bundling)
        run: xvfb-run -a npm run test:electron
        env:
          CI: 'true'
          PX_GPU_SWITCHES: swiftshader
      - run: npm run build
      - name: Electron on dist/web (the production bundle it ships)
        run: xvfb-run -a npm run test:electron
        env:
          CI: 'true'
          PX_GPU_SWITCHES: swiftshader
          PX_ELECTRON_ROOT: dist/web
      - uses: actions/upload-artifact@v4
        with:
          name: dist-web
          path: dist/web
          retention-days: 7
